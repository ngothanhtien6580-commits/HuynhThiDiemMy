<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chúc Mừng Sinh Nhật Diễm My 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-deep:#ff5f96;
    --pink:#ff8fb8;
    --pink-light:#ffd6e5;
    --purple-deep:#241536;
    --purple:#6b4ba1;
    --lavender:#c9a8ff;
    --gold:#ffd166;
    --cream:#fff8f2;
    --mint:#a8e6cf;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%;
    overflow:hidden;
    font-family:'Nunito',sans-serif;
    background:#000;
    color:var(--cream);
    -webkit-tap-highlight-color:transparent;
  }
  #stars-canvas, #confetti-canvas, #vortex-canvas{
    position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none;
  }
  #vortex-canvas{ z-index:1; }

  /* ---------- COVER ---------- */
  #cover{
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px;
    background:radial-gradient(circle at 50% 35%, var(--purple) 0%, var(--purple-deep) 70%);
    transition:transform .9s cubic-bezier(.7,0,.84,0), opacity .9s ease;
  }
  #cover.open{ transform:scale(6); opacity:0; pointer-events:none; }
  .cover-cake{ font-size:68px; animation:bob 2.4s ease-in-out infinite; filter:drop-shadow(0 0 18px rgba(255,180,220,.6)); }
  @keyframes bob{ 0%,100%{transform:translateY(0) rotate(-4deg);} 50%{transform:translateY(-14px) rotate(4deg);} }
  #cover p{ font-size:15px; opacity:.85; text-align:center; padding:0 30px; }
  #openBtn{
    font-family:'Mali',cursive; font-size:19px; font-weight:700;
    padding:14px 34px; border:none; border-radius:50px; cursor:pointer;
    background:linear-gradient(135deg,var(--pink),var(--pink-deep));
    color:#fff; box-shadow:0 8px 24px rgba(255,95,150,.45);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }

  /* ---------- UNIVERSE (single continuous scene) ---------- */
  #universe{
    position:fixed; inset:0; z-index:10; overflow:hidden;
    opacity:0; transform:scale(.25);
    pointer-events:none;
    transition:opacity 1s ease .15s, transform 1.1s cubic-bezier(.2,1.4,.4,1) .15s;
  }
  #universe.show{ opacity:1; transform:scale(1); pointer-events:auto; }

  .headline{ position:absolute; top:6%; left:0; right:0; z-index:8; text-align:center; padding:0 20px; }
  .bloom{ opacity:0; transform:scale(.4); animation:bloom .7s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes bloom{ to{opacity:1; transform:scale(1);} }
  .d1{animation-delay:.1s;} .d2{animation-delay:.35s;} .d3{animation-delay:.6s;}

  .line-small{ font-family:'Mali',cursive; font-size:clamp(17px,4.6vw,21px); font-weight:600; color:var(--gold); margin-bottom:4px;}
  .name-big{ font-family:'Mali',cursive; font-size:clamp(24px,7.4vw,38px); font-weight:700; color:#fff; text-shadow:0 0 20px rgba(255,150,190,.65); line-height:1.2;}
  .subtitle{ margin-top:8px; font-size:13px; color:var(--pink-light); max-width:280px; margin-left:auto; margin-right:auto; line-height:1.4;}

  /* black hole */
  .black-hole-wrap{ position:absolute; top:58%; left:50%; transform:translate(-50%,-50%); width:170px; height:170px; z-index:3; }
  .bh-ring{ position:absolute; inset:0; border-radius:50%; filter:blur(2px);
    background:conic-gradient(from 0deg, #000 0deg, var(--pink-deep) 55deg, var(--purple-deep) 130deg, var(--lavender) 210deg, #000 290deg, #000 360deg);
    animation:spin 7s linear infinite; box-shadow:0 0 50px 12px rgba(255,95,150,.35);
  }
  .bh-core{ position:absolute; inset:16%; border-radius:50%; background:radial-gradient(circle, #050006 55%, #1a0018 100%); box-shadow:inset 0 0 24px 6px rgba(255,110,165,.5); }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .heart-glow{ position:absolute; top:27%; left:50%; transform:translate(-50%,-50%); width:100px; height:100px; border-radius:50%; z-index:4;
    background:radial-gradient(circle, rgba(255,110,165,.6), transparent 70%); filter:blur(5px); animation:heartbeat 1.8s ease-in-out infinite; }
  @keyframes heartbeat{ 0%,100%{transform:translate(-50%,-50%) scale(1); opacity:.85;} 50%{transform:translate(-50%,-50%) scale(1.15); opacity:1;} }

  .orbit-ring{ position:absolute; top:58%; left:50%; width:0; height:0; z-index:5; }
  .orbit-item{
    position:absolute; top:0; left:0; transform:translate(-50%,-50%);
    font-family:'Mali',cursive; font-weight:700; font-size:12.5px; line-height:1.3;
    text-align:center; max-width:130px; white-space:normal;
  }
  .orbit-sticker{ position:absolute; top:0; left:0; transform:translate(-50%,-50%); pointer-events:none; filter:drop-shadow(0 0 8px rgba(255,150,190,.5)); }

  .amb-heart{ position:absolute; bottom:-30px; font-size:15px; opacity:0; z-index:2; pointer-events:none; animation:ambFloat linear infinite; }
  @keyframes ambFloat{ 0%{transform:translateY(0) translateX(0); opacity:0;} 12%{opacity:.65;} 88%{opacity:.55;} 100%{transform:translateY(-105vh) translateX(var(--dx,18px)); opacity:0;} }

  .balloon{ position:absolute; bottom:-120px; width:40px; height:52px; border-radius:50%/58% 58% 42% 42%; opacity:.8; animation:floatUp linear infinite; z-index:2;}
  .balloon::after{ content:''; position:absolute; left:50%; bottom:-34px; width:1px; height:34px; background:rgba(255,255,255,.5); transform:translateX(-50%);}
  @keyframes floatUp{ 0%{transform:translateY(0) translateX(0);} 50%{transform:translateY(-55vh) translateX(20px);} 100%{transform:translateY(-115vh) translateX(-10px);} }

  /* cake / candle dock */
  .cake-dock{ position:absolute; bottom:5%; left:50%; transform:translateX(-50%); z-index:8; text-align:center; }
  .cake-wrap{ position:relative; width:110px; margin:0 auto 10px; cursor:pointer;}
  .flame{ position:absolute; top:-26px; left:50%; width:10px; height:16px; transform:translateX(-50%); background:radial-gradient(circle,#fff6c8 0%,var(--gold) 55%,#ff9d3d 100%); border-radius:50%/60% 60% 40% 40%; animation:flicker 1s ease-in-out infinite; transform-origin:bottom center;}
  @keyframes flicker{ 0%,100%{transform:translateX(-50%) scale(1) rotate(-2deg);} 50%{transform:translateX(-50%) scale(1.12) rotate(3deg);} }
  .flame.blown{ animation:none !important; opacity:0; transform:translateX(-50%) scale(0); transition:all .35s ease;}
  .wick{ position:absolute; top:-12px; left:50%; width:2.5px; height:12px; background:#7a5230; transform:translateX(-50%);}
  .cake-top{ width:80px; height:25px; margin:0 auto; background:linear-gradient(180deg,#fff,var(--pink-light)); border-radius:50% 50% 0 0/100% 100% 0 0; position:relative; z-index:2;}
  .cake-mid{ width:110px; height:42px; background:linear-gradient(160deg,var(--pink),var(--pink-deep)); border-radius:12px; margin-top:-4px; position:relative; box-shadow:0 8px 20px rgba(0,0,0,.35); overflow:hidden;}
  .cake-mid::before{content:''; position:absolute; top:8px; left:0; right:0; height:4px; background:repeating-linear-gradient(90deg,#fff 0 8px,transparent 8px 16px); opacity:.5;}
  .tap-hint{ font-size:12px; color:var(--pink-light); opacity:.85; max-width:220px; margin:0 auto;}

  .credit-tag{
    position:fixed; bottom:10px; right:14px; z-index:30;
    font-family:'Nunito',sans-serif; font-size:11px; letter-spacing:.2px;
    color:rgba(255,255,255,.5); pointer-events:none;
  }
</style>
</head>
<body>

<canvas id="stars-canvas"></canvas>
<canvas id="vortex-canvas"></canvas>
<canvas id="confetti-canvas"></canvas>
<div class="credit-tag">Made with 🤍 by Ngô Thành Tiến</div>

<div id="cover">
  <div class="cover-cake">🎂</div>
  <h1 style="font-family:'Mali',cursive; font-size:21px; font-weight:600;">Có một điều bất ngờ dành cho cậu...</h1>
  <p>Chạm vào để mở nhé 👇</p>
  <button id="openBtn">Mở quà 🎁</button>
</div>

<div id="universe">
  <div class="headline">
    <div class="line-small bloom d1">Chúc mừng sinh nhật</div>
    <div class="name-big bloom d2">Huỳnh Thị Diễm My</div>
    <div class="subtitle bloom d3">Một năm mới, một hành trình mới đang chờ cậu phía trước 🌷</div>
  </div>

  <div class="black-hole-wrap">
    <div class="bh-ring"></div>
    <div class="bh-core"></div>
  </div>
  <div class="heart-glow"></div>
  <div class="orbit-ring" id="orbitRing"></div>

  <div class="cake-dock">
    <div class="cake-wrap" id="cakeWrap">
      <div class="wick"></div>
      <div class="flame" id="flame"></div>
      <div class="cake-top"></div>
      <div class="cake-mid"></div>
    </div>
    <div class="tap-hint" id="wishHint">Chạm vào ngọn nến để ước một điều nhé ✨</div>
  </div>
</div>

// ---------- Stars background ----------
const starsCanvas = document.getElementById('stars-canvas');
const sctx = starsCanvas.getContext('2d');
let stars = [];
function resize(){
  starsCanvas.width = confettiCanvas.width = vortexCanvas.width = window.innerWidth;
  starsCanvas.height = confettiCanvas.height = vortexCanvas.height = window.innerHeight;
}
function initStars(){
  stars = Array.from({length:90}, () => ({
    x: Math.random()*starsCanvas.width,
    y: Math.random()*starsCanvas.height,
    r: Math.random()*1.6+.3,
    a: Math.random()*Math.PI*2,
    speed: Math.random()*.02+.005
  }));
}
function drawStars(){
  sctx.clearRect(0,0,starsCanvas.width,starsCanvas.height);
  stars.forEach(s=>{
    s.a += s.speed;
    const alpha = (Math.sin(s.a)+1)/2;
    sctx.fillStyle = `rgba(255,255,255,${0.2+alpha*0.8})`;
    sctx.beginPath();
    sctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    sctx.fill();
  });
  requestAnimationFrame(drawStars);
}

// ---------- Confetti ----------
const confettiCanvas = document.getElementById('confetti-canvas');
const cctx = confettiCanvas.getContext('2d');
let confetti = [];
const confettiColors = ['#ff8fb8','#ffd166','#c9a8ff','#ff5f96','#fff8f2'];
function burstConfetti(x,y,count){
  count = count || 60;
  for(let i=0;i<count;i++){
    confetti.push({
      x, y,
      vx:(Math.random()-.5)*8,
      vy:Math.random()*-9-2,
      size:Math.random()*6+4,
      color:confettiColors[Math.floor(Math.random()*confettiColors.length)],
      rot:Math.random()*360,
      vr:(Math.random()-.5)*10,
      life:1
    });
  }
}
function drawConfetti(){
  cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  confetti.forEach(p=>{
    p.vy += 0.28; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 0.012;
    cctx.save();
    cctx.translate(p.x,p.y);
    cctx.rotate(p.rot*Math.PI/180);
    cctx.globalAlpha = Math.max(p.life,0);
    cctx.fillStyle = p.color;
    cctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    cctx.restore();
  });
  confetti = confetti.filter(p=>p.life>0 && p.y < confettiCanvas.height+50);
  requestAnimationFrame(drawConfetti);
}

// ---------- Vortex: particles swirling into the black hole + sparkle heart ----------
const vortexCanvas = document.getElementById('vortex-canvas');
const vctx = vortexCanvas.getContext('2d');
let vortexParticles = [];
let heartParticles = [];
let vortexTime = 0;

function initVortexParticles(){
  const maxR = Math.min(vortexCanvas.width, vortexCanvas.height) * 0.6;
  vortexParticles = Array.from({length:170}, () => ({
    angle: Math.random()*Math.PI*2,
    radius: 20 + Math.random()*maxR,
    maxR,
    speed: 0.006 + Math.random()*0.016,
    pull: 0.3 + Math.random()*0.55,
    size: Math.random()*2+0.6,
    color: Math.random()<0.55 ? '255,120,175' : '201,168,255'
  }));
}
function initHeartParticles(){
  const scale = Math.min(vortexCanvas.width, vortexCanvas.height) * 0.012;
  heartParticles = Array.from({length:110}, () => {
    const t = Math.random()*Math.PI*2;
    const fill = 0.3 + Math.random()*0.7;
    const hx = 16*Math.pow(Math.sin(t),3);
    const hyRaw = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    return {
      dx: hx*scale*fill,
      dy: -hyRaw*scale*fill,
      size: Math.random()*2+0.7,
      phase: Math.random()*Math.PI*2,
      speed: 0.04+Math.random()*0.07
    };
  });
}
function drawVortexFrame(){
  const w = vortexCanvas.width, h = vortexCanvas.height;
  const cx = w/2, cy = h*0.58;
  const hx = w/2, hy = h*0.27;
  vortexTime += 1;
  vctx.fillStyle = 'rgba(0,0,0,0.24)';
  vctx.fillRect(0,0,w,h);

  vortexParticles.forEach(p=>{
    p.angle += p.speed;
    p.radius -= p.pull;
    if(p.radius < 6){ p.radius = p.maxR; p.angle = Math.random()*Math.PI*2; }
    const x = cx + Math.cos(p.angle)*p.radius;
    const y = cy + Math.sin(p.angle)*p.radius*0.5;
    const alpha = Math.max(0.1, Math.min(0.9, 1 - p.radius/p.maxR + 0.15));
    vctx.beginPath();
    vctx.fillStyle = `rgba(${p.color},${alpha})`;
    vctx.arc(x,y,p.size,0,Math.PI*2);
    vctx.fill();
  });

  heartParticles.forEach(p=>{
    const tw = (Math.sin(vortexTime*p.speed + p.phase)+1)/2;
    vctx.beginPath();
    vctx.fillStyle = `rgba(255,${175+Math.floor(tw*55)},${205+Math.floor(tw*35)},${0.35+tw*0.65})`;
    vctx.arc(hx+p.dx, hy+p.dy, p.size*(0.7+tw*0.6), 0, Math.PI*2);
    vctx.fill();
  });

  requestAnimationFrame(drawVortexFrame);
}

const orbitRing = document.getElementById('orbitRing');
let orbitItems = [];
function buildOrbitItems(){
  orbitItems = orbitContent.map((item,i)=>{
    let el;
    if(item.type === 'img'){
      el = document.createElement('img');
      el.className = 'orbit-sticker';
      el.src = stickerData[item.key];
      el.style.width = stickerWidths[item.key] + 'px';
    } else {
      el = document.createElement('div');
      el.className = 'orbit-item';
      el.textContent = item.text;
      el.style.color = item.color;
      el.style.textShadow = `0 0 8px ${item.color}`;
    }
    orbitRing.appendChild(el);
    return { el, offset: (Math.PI*2/orbitContent.length)*i };
  });
}
let orbitAngle = 0;
function animateOrbit(){
  orbitAngle += 0.0035;
  const rx = Math.min(window.innerWidth*0.42, 170);
  const ry = rx*0.62;
  orbitItems.forEach(item=>{
    const a = orbitAngle + item.offset;
    const x = Math.cos(a)*rx;
    const y = Math.sin(a)*ry;
    const depth = (Math.sin(a)+1)/2;
    item.el.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${(0.75+depth*0.4).toFixed(2)})`;
    item.el.style.opacity = (0.5 + depth*0.5).toFixed(2);
    item.el.style.zIndex = depth > 0.5 ? '6' : '2';
  });
  requestAnimationFrame(animateOrbit);
}

// ---------- Chime sound (synth, no audio files) ----------
let audioCtx;
function playChime(freqs){
  freqs = freqs || [880,1174];
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + i*0.08 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i*0.08 + 0.5);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + i*0.08);
      o.stop(audioCtx.currentTime + i*0.08 + 0.5);
    });
  }catch(e){}
}
